
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria de imagens otimizada com performance avançada e lazy loading.">
  <title>Lazy Loading com Animações e SEO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Galeria de Imagens com Lazy Loading</h1>
  </header>

  <main>
    <div class="gallery">

      <img data-src="img/itsover.png" src="img/itsover.png"
        alt="Fotografia dizendo a verdade, ou seja, acabou"
        class="lazy" loading="lazy">

      <img data-src="img/needtosay.png" src="img/needtosay.png"
        alt="Fotografia perguntando se é realmente necessário falar"
        class="lazy" loading="lazy">

      <img data-src="img/nobell.jpg" src="img/nobell.jpg"
        alt="Fotografia perguntando se acabou pois ele não ouviu o sino da verdade"
        class="lazy" loading="lazy">

    </div>
  </main>

  <script src="js/lazyload.js"></script>
</body>
</html>
